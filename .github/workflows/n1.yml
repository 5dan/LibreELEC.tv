name: Build LibreELEC for Phicomm N1

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 签出代码
      uses: actions/checkout@v4
      with:
        repository: LibreELEC/LibreELEC.tv
        fetch-depth: 1

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make gcc g++ git texinfo \
          build-essential curl wget \
          gperf bison flex libtool \
          libxml2-utils xsltproc \
          bc swig python3 python3-distutils \
          libssl-dev libcap-dev \
          ccache \
          xfonts-utils \
          rdfind \
          libparse-yapp-perl \
          libxml-parser-perl \
          patchutils \
          lzop

    - name: 执行编译（带 box 配置）
      run: |
        PROJECT=Amlogic ARCH=aarch64 DEVICE=AMLGX UBOOT_SYSTEM=box make image

    # 修正后的验证步骤：检查生成的镜像文件
    - name: 验证编译产物
      run: |
        echo "=== target 目录内容 ==="
        ls -la target/
        
        # 统计生成的镜像数量
        IMG_COUNT=$(find target/ -name "*.img.gz" | wc -l)
        echo "找到 $IMG_COUNT 个镜像文件"
        
        if [ $IMG_COUNT -eq 0 ]; then
          echo "❌ 错误：没有找到任何镜像文件"
          exit 1
        else
          echo "✅ 成功生成镜像文件"
          # 列出所有镜像
          find target/ -name "*.img.gz" -exec basename {} \;
        fi

    - name: 上传镜像产物
      uses: actions/upload-artifact@v4
      with:
        name: LibreELEC-N1-Image
        path: target/*.img.gz
        if-no-files-found: error
