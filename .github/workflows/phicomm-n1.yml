name: Build LibreELEC for Phicomm N1

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    # 直接使用 Ubuntu 22.04 运行器，不通过 Docker 容器
    runs-on: ubuntu-22.04

    steps:
    - name: 签出代码
      uses: actions/checkout@v4
      with:
        repository: LibreELEC/LibreELEC.tv
        fetch-depth: 1

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        # 官方文档推荐的依赖包列表[citation:1]
        sudo apt-get install -y \
          make gcc g++ git texinfo \
          build-essential curl wget \
          gperf bison flex libtool \
          libxml2-utils xsltproc \
          bc swig python3 python3-distutils \
          libssl-dev libcap-dev \
          ccache

    # 关键：使用 AMLGX 设备，ARCH 为 aarch64
    - name: 执行编译
      run: |
        PROJECT=Amlogic ARCH=aarch64 make image

    - name: 验证内核格式
      run: |
        KERNEL_FILE=$(find target/ -name "kernel.img" | head -n 1)
        if [ -f "$KERNEL_FILE" ]; then
          echo "正在验证内核文件: $KERNEL_FILE"
          file "$KERNEL_FILE"
          if file "$KERNEL_FILE" | grep -q "gzip compressed"; then
            echo "⚠️ 警告: 检测到内核是压缩格式，N1可能无法启动！"
            exit 1
          else
            echo "✅ 验证通过: 内核是未压缩格式"
          fi
        else
          echo "未找到 kernel.img"
          exit 1
        fi

    - name: 上传镜像产物
      uses: actions/upload-artifact@v4
      with:
        name: LibreELEC-N1-Image
        path: target/*.img.gz
        if-no-files-found: error
